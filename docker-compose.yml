services:
  postgres:
    image: postgres:16-alpine
    container_name: evolutiwhats-postgres
    environment:
      POSTGRES_USER: evolutiwhats
      POSTGRES_PASSWORD: evolutiwhats_dev_2024
      POSTGRES_DB: evolutiwhats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolutiwhats"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evolutiwhats-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: evolutiwhats-evolution
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=evolution_dev_key_2024
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolutiwhats:evolutiwhats_dev_2024@postgres:5432/evolutiwhats
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
